<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://qsycldeqkdgteccdpsty.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Activate Acoustic for Windows</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="activate.js" defer></script>
</head>
<body>
  <main class="band">
    <div class="wrap">
      <a href="index.html#windows-beta">← Acoustic</a>
      <div class="beta-options beta-activation">
        <section class="beta-option" aria-labelledby="activateTitle">
          <h3 id="activateTitle">Activate Acoustic for Windows</h3>
          <p id="activateStatus" role="status">Open Acoustic on Windows and choose Activate on website to start.</p>
          <form id="activateEmailForm" hidden>
            <label for="activateEmail">The email you used to download Acoustic</label>
            <input type="email" id="activateEmail" autocomplete="email" maxlength="254" required>
            <button class="btn-primary" type="submit">Send verification code</button>
          </form>
          <form id="activateCodeForm" hidden>
            <label for="verifyCode">Email verification code</label>
            <input id="verifyCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required>
            <button class="btn-primary" type="submit">Activate this copy of Acoustic</button>
            <button id="activateAgain" type="button">Use a different email or resend the code</button>
          </form>
          <p><a href="legal.html#privacy">Privacy Policy</a></p>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
